name: Import MedMitra starter
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-{01..06}.b64 | base64 --decode > "$RUNNER_TEMP/medmitra.tar.xz"
          printf '%s  %s\n' 'e207122dbae8ae8976577bf8bf09e39c2225d38f3cfe70bb09de0c91907695cd' "$RUNNER_TEMP/medmitra.tar.xz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/medmitra-extracted"
          tar -xJf "$RUNNER_TEMP/medmitra.tar.xz" -C "$RUNNER_TEMP/medmitra-extracted" --no-same-owner
          test -f "$RUNNER_TEMP/medmitra-extracted/MedMitra/lib/main.dart"
          test -f "$RUNNER_TEMP/medmitra-extracted/MedMitra/pubspec.yaml"
          cp -a "$RUNNER_TEMP/medmitra-extracted/MedMitra/." .
          rm -rf bootstrap
          rm .github/workflows/import-starter.yml
          python3 scripts/check_source.py

      - name: Commit unpacked Flutter source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'feat: import MedMitra Flutter starter source'
          git push origin HEAD:main
