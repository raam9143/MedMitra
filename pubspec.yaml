name: medmitra
description: Offline-first medicine reminder application for Indian families.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^20.0.0
  flutter_tts: ^4.2.5
  flutter_timezone: ^5.0.0
  timezone: ^0.10.1
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  record: ^6.1.0
  just_audio: ^0.10.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
