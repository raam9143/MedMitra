name: Flutter source checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Android components
        run: |
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true
      - name: Bootstrap and analyze
        run: bash scripts/bootstrap_android.sh
      - name: Build debug APK
        run: flutter build apk --debug
